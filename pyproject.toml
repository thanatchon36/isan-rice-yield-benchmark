[project]
name = "isanrice"
version = "0.1.0"
description = "Leakage-safe, explainable district-level rice yield forecasting: a ground-truth simulation benchmark for Northeast Thailand"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thanatchon Chongmankhong" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "shapely>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyproj>=3.6"]
gee = ["earthengine-api>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/thanatchon36/isan-rice-yield-benchmark"
Paper = "https://thanatchon36.github.io/isan-rice-yield-benchmark/paper/"
Dataset = "https://huggingface.co/datasets/thanatchon36/isan-rice-yield-benchmark"

[project.scripts]
isanrice = "isanrice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isanrice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
